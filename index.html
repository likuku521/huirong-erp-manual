<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧镕科技 · 金蝶云星空ERP · 员工操作手册</title>
<style>
:root{
  --m-bg:#F0F5FA;--m-card:#ffffff;--m-primary:#1A6DC8;--m-primary-dark:#0D4E8C;
  --m-accent1:#2B88D9;--m-accent2:#3A9BE5;--m-accent3:#5BB0F0;
  --m-text:#2C3E50;--m-text-light:#6B7B8D;--m-border:#C8DAE8;--m-hover:#E3EEF7;
  --m-sidebar:#F5F9FD;--m-tag-bg:#DCE8F3;--m-success:#2EAD6B;--m-warning:#E8A838;
  --m-info:#3A8FD6;--m-danger:#D94E4E;
  --shadow-sm:0 1px 3px rgba(26,109,200,.06);--shadow-md:0 4px 12px rgba(26,109,200,.08);--shadow-lg:0 8px 24px rgba(26,109,200,.10);
  --radius:12px;--radius-sm:8px;--transition:all .3s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--m-bg);color:var(--m-text);line-height:1.7;font-size:14px;overflow-x:hidden}

/* ===== Landing 入口页 ===== */
#landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#F0F5FA 0%,#D6E6F5 50%,#E8F0F8 100%)}
.landing-header{text-align:center;margin-bottom:42px}
.landing-header .company{font-size:13px;color:var(--m-text-light);letter-spacing:4px;text-transform:uppercase;margin-bottom:12px}
.landing-header h1{font-size:30px;font-weight:600;color:var(--m-text);margin-bottom:8px}
.landing-header .subtitle{font-size:15px;color:var(--m-text-light)}
.landing-header .divider{width:60px;height:2px;background:var(--m-primary);margin:18px auto}
.role-cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.role-card{background:var(--m-card);border-radius:var(--radius);padding:34px 28px;width:230px;text-align:center;cursor:pointer;transition:var(--transition);box-shadow:var(--shadow-sm);border:1px solid var(--m-border);position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;transition:var(--transition)}
.role-card:nth-child(1)::before{background:var(--m-accent2)}
.role-card:nth-child(2)::before{background:var(--m-primary)}
.role-card:nth-child(3)::before{background:var(--m-accent3)}
.role-card:nth-child(4)::before{background:var(--m-success)}
.role-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.role-card:hover::before{height:6px}
.role-icon{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
.role-card:nth-child(1) .role-icon{background:#E3F2E8}
.role-card:nth-child(2) .role-icon{background:#DCE8F5}
.role-card:nth-child(3) .role-icon{background:#E8DCF5}
.role-card:nth-child(4) .role-icon{background:#EDF2E9}
.role-card h3{font-size:17px;font-weight:600;margin-bottom:8px}
.role-card p{font-size:12.5px;color:var(--m-text-light);line-height:1.6}
.role-card .module-count{margin-top:14px;font-size:12px;color:var(--m-primary);font-weight:500}

/* ===== 主应用 ===== */
#app{display:none;min-height:100vh}
.top-bar{height:52px;background:var(--m-card);border-bottom:1px solid var(--m-border);display:flex;align-items:center;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm)}
.back-btn{width:34px;height:34px;border:none;background:var(--m-hover);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--m-text);transition:var(--transition);margin-right:14px;flex-shrink:0}
.back-btn:hover{background:var(--m-border)}
.top-bar .title{font-size:14.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar .home-link{font-size:12px;color:var(--m-primary);cursor:pointer;margin-right:12px;white-space:nowrap}
.top-bar .home-link:hover{text-decoration:underline}
.role-badge{padding:3px 12px;border-radius:16px;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:var(--transition)}
.role-badge:hover{box-shadow:0 0 0 2px var(--m-accent2)}
.rb-all{background:#EDF2E9;color:#4A6B3A}
.rb-ops{background:#E3F2E8;color:#2E7D42}
.rb-fin{background:#DCE8F5;color:#0D4E8C}
.rb-lead{background:#E8DCF5;color:#5E35B1}
.role-switch{position:relative}
.role-menu{position:absolute;top:40px;right:0;background:#fff;border:1px solid var(--m-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:170px;display:none;z-index:400;overflow:hidden}
.role-menu.open{display:block}
.role-menu-title{padding:8px 14px 4px;font-size:10.5px;font-weight:600;color:var(--m-text-light);letter-spacing:1px;text-transform:uppercase;background:var(--m-sidebar)}
.role-menu-item{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--m-text);transition:background .15s;display:flex;align-items:center;gap:6px}
.role-menu-item:hover{background:var(--m-hover)}
.role-menu-item.sep{border-top:1px solid var(--m-border);color:var(--m-primary-dark);font-weight:500}
.search-box{margin-left:12px;position:relative}
.search-box input{width:190px;height:32px;border:1px solid var(--m-border);border-radius:16px;padding:0 12px 0 30px;font-size:12.5px;background:var(--m-bg);color:var(--m-text);outline:none;transition:var(--transition)}
.search-box input:focus{border-color:var(--m-primary);width:240px;background:#fff}
.search-box::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.search-results{position:absolute;top:40px;right:0;left:0;background:#fff;border:1px solid var(--m-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;display:none;z-index:300}
.search-results.active{display:block}
.search-result-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--m-border);transition:background .15s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--m-hover)}
.search-result-item .sr-title{font-weight:600;font-size:12.5px}
.search-result-item .sr-path{font-size:10.5px;color:var(--m-text-light);margin-top:1px}
.search-result-item .sr-snippet{font-size:11.5px;color:var(--m-text-light);margin-top:2px;line-height:1.5}
.search-result-item mark{background:#F6E7B8;border-radius:2px;padding:0 2px}

.content-wrapper{display:flex;margin-top:52px;min-height:calc(100vh - 52px)}
/* ===== Sidebar ===== */
.sidebar{width:250px;background:var(--m-sidebar);border-right:1px solid var(--m-border);position:fixed;top:52px;left:0;bottom:0;overflow-y:auto;padding:12px 0;z-index:50}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--m-border);border-radius:2px}
.nav-group{margin-bottom:6px}
.nav-group-title{padding:8px 20px 4px;font-size:11px;font-weight:600;color:var(--m-text-light);text-transform:uppercase;letter-spacing:1px}
.nav-group-title.clickable{cursor:pointer;color:var(--m-primary-dark)}
.nav-group-title.clickable:hover{color:var(--m-primary)}
.nav-item{display:flex;align-items:center;padding:8px 20px;cursor:pointer;transition:var(--transition);font-size:13.5px;color:var(--m-text);border-left:3px solid transparent}
.nav-item:hover{background:var(--m-hover)}
.nav-item.active{background:var(--m-card);border-left-color:var(--m-primary);font-weight:600;color:var(--m-primary-dark)}
.nav-item .nav-icon{width:20px;margin-right:10px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;background:var(--m-tag-bg);color:var(--m-text-light);font-size:10.5px;padding:1px 7px;border-radius:10px;flex-shrink:0}
.nav-item .nav-badge.b-hot{background:var(--m-primary);color:#fff}

/* ===== Main ===== */
.main-content{flex:1;margin-left:250px;padding:24px 32px 50px;max-width:calc(100% - 250px)}
.section{display:none;animation:fadeIn .3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.c-section{margin-bottom:26px;scroll-margin-top:60px}
.c-section h2{font-size:20px;font-weight:600;color:var(--m-text);margin-bottom:6px}
.c-section h3{font-size:14px;font-weight:600;color:var(--m-primary-dark);margin:14px 0 6px}
.page-desc{font-size:13px;color:var(--m-text-light);margin-bottom:14px}
.content-card{background:var(--m-card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);border:1px solid var(--m-border)}
.path{display:inline-block;background:var(--m-tag-bg);padding:3px 10px;border-radius:4px;font-size:12px;color:var(--m-primary-dark);margin:4px 0 8px;font-family:Consolas,monospace}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:8px 10px;background:var(--m-sidebar);border:1px solid var(--m-border);border-radius:var(--radius-sm);margin:6px 0;font-size:12px}
.flow .fl{color:var(--m-primary-dark);font-weight:600;background:#fff;border:1px solid var(--m-accent2);border-radius:4px;padding:2px 9px}
.flow .fa{color:var(--m-text-light)}
.step{background:var(--m-sidebar);border-radius:var(--radius-sm);padding:10px 12px 10px 36px;margin:6px 0;border-left:3px solid var(--m-primary);position:relative}
.step::before{content:attr(data-n);position:absolute;left:8px;top:10px;width:20px;height:20px;background:var(--m-primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.step .st{font-size:13.5px;font-weight:600;color:var(--m-primary-dark);margin-bottom:2px}
.step .sd{font-size:12.5px;color:var(--m-text);line-height:1.7}
.tip{padding:7px 12px;border-radius:var(--radius-sm);margin:6px 0;font-size:12.5px;line-height:1.6}
.tip-w{background:#FDF6E8;border-left:3px solid var(--m-warning);color:#8A6D1F}.tip-w::before{content:"⚠ "}
.tip-i{background:var(--m-tag-bg);border-left:3px solid var(--m-info);color:#2A5A80}.tip-i::before{content:"💡 "}
.tip-k{background:#EDF7EF;border-left:3px solid var(--m-success);color:#2E6B3E}.tip-k::before{content:"🔑 "}
.tip-r{background:#FBEEEE;border-left:3px solid var(--m-danger);color:#8A3232}.tip-r::before{content:"✘ "}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;border-radius:var(--radius-sm);overflow:hidden}
thead th{padding:6px 10px;text-align:left;font-weight:600;font-size:11.5px;background:var(--m-primary);color:#fff}
tbody td{padding:6px 10px;border-bottom:1px solid var(--m-border)}
tbody tr:nth-child(even){background:var(--m-sidebar)}
tbody tr:hover{background:var(--m-hover)}
/* 截图上传 */
.shot{margin:6px 0;border-radius:var(--radius-sm);overflow:hidden}
.shot-placeholder{background:var(--m-sidebar);border:2px dashed var(--m-border);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--m-text-light);display:flex;gap:8px;align-items:flex-start}
.shot-placeholder b{color:var(--m-primary-dark)}
.shot-placeholder .snote{color:var(--m-danger)}
.shot-hint{font-size:10.5px;color:var(--m-text-light);margin-top:2px}
.shot.has-img{padding:3px;background:var(--m-sidebar);border:1.5px solid var(--m-accent2)}
.shot-img img{width:100%;border-radius:6px;cursor:zoom-in;display:block}
.shot-img img.full{position:fixed;inset:0;z-index:300;width:100vw;height:100vh;object-fit:contain;background:rgba(0,0,0,.85);border-radius:0;cursor:zoom-out}
.shot-info{padding:3px 8px;font-size:11px;color:var(--m-text-light)}
.shot-actions{display:flex;gap:4px;padding:0 8px 5px}
.shot-btn{font-size:11px;padding:2px 10px;border:1px solid var(--m-border);border-radius:12px;background:#fff;cursor:pointer;color:var(--m-primary-dark)}
.shot-btn:hover{background:var(--m-hover)}
/* 速查 */
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.qrow select,.qrow input{padding:6px 10px;border:1px solid var(--m-border);border-radius:var(--radius-sm);font-size:12.5px;outline:none;background:#fff}
.qrow select:focus,.qrow input:focus{border-color:var(--m-accent2)}
.qbtn{padding:6px 16px;border:none;border-radius:var(--radius-sm);background:var(--m-primary);color:#fff;font-size:12.5px;cursor:pointer;transition:var(--transition)}
.qbtn:hover{background:var(--m-primary-dark)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:8px 0}
.chain .node{background:var(--m-tag-bg);border:1.5px solid var(--m-primary);color:var(--m-primary-dark);border-radius:5px;padding:4px 10px;font-size:12px;font-weight:600}
.chain .node.final{background:var(--m-primary);color:#fff}
.chain .arr{color:var(--m-text-light);font-size:13px}
.ccline{margin-top:4px;font-size:11px;color:var(--m-text-light)}
.ccline b{color:var(--m-primary-dark)}
@keyframes scaleIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.chain .node.scale-in{opacity:0;transform:scale(.3)}
.chain .node.scale-in.done{animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1) both}
/* 返回按钮（页面内） */
.back-link{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px solid var(--m-border);border-radius:16px;background:var(--m-card);color:var(--m-primary-dark);font-size:12px;cursor:pointer;margin-bottom:10px;transition:var(--transition)}
.back-link:hover{background:var(--m-hover);border-color:var(--m-accent2)}
/* 分页器 */
.pager{display:flex;justify-content:space-between;padding:10px 0;margin-top:14px;border-top:1px solid var(--m-border)}
.pager button{padding:5px 14px;border:1px solid var(--m-border);border-radius:16px;background:var(--m-card);color:var(--m-text);font-size:11px;cursor:pointer}
.pager button:hover:not(:disabled){background:var(--m-hover)}
.pager button:disabled{opacity:.3;cursor:default}
.btt{position:fixed;bottom:16px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--m-primary);color:#fff;border:none;font-size:14px;cursor:pointer;opacity:0;transition:opacity .3s;z-index:200;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btt.show{opacity:1}
.btn-ripple{position:relative;overflow:hidden}
.btn-ripple .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);animation:rippleAnim .55s}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
.sidebar-toggle{display:none;position:fixed;bottom:16px;left:14px;z-index:300;width:38px;height:38px;border-radius:50%;background:var(--m-primary);color:#fff;border:none;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media(max-width:800px){
  .sidebar{position:fixed;left:-250px;transition:left .3s;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  .sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .main-content{margin-left:0;padding:16px 14px 60px}
  .search-box input{width:110px}
  .search-box input:focus{width:150px}
  .top-bar .title{font-size:13px}
  .role-cards .role-card{width:100%;max-width:340px}
  .landing-header h1{font-size:24px}
}
</style>
</head>
<body>

<!-- ═══ LANDING 入口选择 ═══ -->
<div id="landing">
  <div class="landing-header">
    <div class="company">HUI RONG TECH</div>
    <h1>慧镕科技 · 金蝶云星空ERP</h1>
    <div class="subtitle">最终用户操作手册 · 亮色紧凑版</div>
    <div class="divider"></div>
  </div>
  <div class="role-cards" id="landingCards"></div>
</div>

<!-- ═══ 主应用 ═══ -->
<div id="app">

  <!-- 顶栏 -->
  <div class="top-bar">
    <button class="back-btn" id="backBtn" title="返回上一级">←</button>
    <span class="title" id="topTitle">慧镕科技 · 操作手册</span>
    <span class="home-link" onclick="goHome()">🏠 首页</span>
    <div class="role-switch">
      <span class="role-badge" id="roleBadge" onclick="toggleRoleMenu()">📋 全部 ▾</span>
      <div class="role-menu" id="roleMenu">
        <div class="role-menu-title">切换身份视角</div>
        <div class="role-menu-item" data-role="all" onclick="switchRole('all')">📋 全部内容</div>
        <div class="role-menu-item" data-role="ops" onclick="switchRole('ops')">👤 操作人员</div>
        <div class="role-menu-item" data-role="fin" onclick="switchRole('fin')">💰 财务人员</div>
        <div class="role-menu-item" data-role="lead" onclick="switchRole('lead')">📊 领导层</div>
        <div class="role-menu-item sep" onclick="enterApp(CURRENT_ROLE)">🏠 返回入口页</div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="q" placeholder="搜索单据、操作、流程…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="content-wrapper">
    <!-- 侧边导航 -->
    <nav class="sidebar" id="sidebar">
      <div id="navRoot"></div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <div class="pager" id="pager">
    <button id="prevBtn" disabled onclick="goPrev()">← 上一节</button>
    <button id="nextBtn" onclick="goNext()">下一节 →</button>
  </div>
</div>

<button class="sidebar-toggle" id="sidebarToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<script>/* ===== 数据引擎 ===== */
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var META = DATA.meta;
var SCENES = DATA.scenes;
var ALLDOCS = [];
SCENES.forEach(function(sc){sc.docs.forEach(function(d){ALLDOCS.push({scene:sc,doc:d});});});
var FLAT=[];
SCENES.forEach(function(sc){
  FLAT.push({id:'sc'+sc.no, ch:sc.no, sec:sc.no, title:'场景'+sc.no+' '+sc.title, path:'场景'+sc.no+' '+sc.title, text:(sc.desc||'')+' '+(sc.flow||[]).join(' ')});
  sc.docs.forEach(function(d){
    var text=[d.title, d.desc||'', (d.rules||[]).join(' '), (d.risks||[]).join(' ')].join(' ');
    (d.steps||[]).forEach(function(s){text+=' '+s.title+' '+(s.desc||'');});
    FLAT.push({id:'doc-'+d.id, ch:sc.no, sec:d.no, title:d.no+' '+d.title, path:'场景'+sc.no+' '+sc.title+' › '+d.no+' '+d.title, text:text});
  });
});

/* ===== 工具 ===== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderTable(tbl){if(!tbl||!tbl.length)return'';var h='<table><thead><tr>'+tbl[0].map(function(c){return'<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';
  for(var i=1;i<tbl.length;i++)h+='<tr>'+tbl[i].map(function(c){return'<td>'+esc(c)+'</td>'}).join('')+'</tr>';return h+'</tbody></table>';}
function bullets(arr){if(!arr||!arr.length)return'';return'<ul style="margin:4px 0 6px 18px;font-size:12.5px">'+arr.map(function(b){return'<li>'+esc(b)+'</li>'}).join('')+'</ul>';}

/* ===== 截图上传（保留） ===== */
function renderShot(shot){
  if(!shot||!shot.no)return'';

  if(saved)return'<div class="shot has-img" data-shot="'+esc(shot.no)+'">'
    +'<div class="shot-img"><img src="'+esc(saved)+'" alt="'+esc(shot.title)+'" onclick="this.classList.toggle(\'full\')"></div>'

  return'<div class="shot" data-shot="'+esc(shot.no)+'">'
    +'<div class="shot-placeholder"><span>📷</span><div><b>FIG.'+esc(shot.no)+' '+esc(shot.title)+'</b>'
    +(shot.ui?'<br>界面：'+esc(shot.ui):'')

    +'<div style="padding:0 10px 6px"><button class="shot-btn" onclick="uploadShot(\''+esc(shot.no)+'\')">📁 上传截图</button>'

    var items=[];

  else{

      main.innerHTML=sc?renderScene(sc):'<div class="c-section"><h2>未找到场景</h2></div>';
    }else{
      var dm=pageId.match(/^doc-(.+)$/);
      if(dm){
        var found=null;

        main.innerHTML=found?renderDoc(found.scene,found.doc):'<div class="c-section"><h2>未找到单据</h2></div>';
      }else main.innerHTML='<div class="c-section"><h2>未找到内容</h2></div>';

/* 搜索索引 */
function searchScope(role){
  if(role==='ops')return FLAT.filter(function(f){return f.ch>=1&&f.ch<=3;});
  if(role==='fin')return FLAT.filter(function(f){return f.ch>=3&&f.ch<=5;});
  if(role==='lead')return FLAT.filter(function(f){return f.ch===1||f.ch===5;});
  return FLAT;
}

}

/* ===== 启动 ===== */
function boot(){
  updateRoleBadge();
  buildNav();renderContent('home');route();
  window.addEventListener('hashchange',route);
  document.getElementById('q').addEventListener('input',onSearch);
  document.getElementById('backBtn').addEventListener('click',goBack);
  document.addEventListener('click',function(e){
    if(!e.target.closest('.search-box'))document.getElementById('searchResults').classList.remove('active');
    if(!e.target.closest('.role-switch'))document.getElementById('roleMenu').classList.remove('open');
  });
  window.addEventListener('scroll',function(){var b=document.getElementById('btt');if(b)b.classList.toggle('show',window.scrollY>300)});
  initRipple();
}
function updateRoleBadge(){
  var names={all:'📋 全部',ops:'👤 操作人员',fin:'💰 财务人员',lead:'📊 领导层'};
  var b=document.getElementById('roleBadge');

function toggleRoleMenu(){document.getElementById('roleMenu').classList.toggle('open');}
function switchRole(r){

function goHome(){go('home');}
function go(h){location.hash='#/'+h.replace(/^\//,'');}
function goBack(){
  var h=location.hash.replace('#/','')||'home';
  if(h.match(/^doc-/)){var f=findDoc(h.replace('doc-',''));if(f)go('sc'+f.scene.no);}
  else if(h.match(/^sc\d+$/))go('home');
  else history.back();
}
function goPrev(){var cur=location.hash.replace('#/','')||'home';var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===cur){idx=i;break}if(idx>0)go(ALL_NAV[idx-1].k);}
function goNext(){var cur=location.hash.replace('#/','')||'home';var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===cur){idx=i;break}if(idx>=0&&idx<ALL_NAV.length-1)go(ALL_NAV[idx+1].k);}

/* ===== 路由 ===== */
function route(){
  var h=location.hash.replace('#/','')||'home';
  renderContent(h);

  var backBtn=document.getElementById('backBtn');

    var sc=SCENES.filter(function(x){return x.no===parseInt(h.replace('sc',''))})[0];
    if(sc){title=sc.icon+' 场景'+sc.no+'：'+sc.title;backBtn.style.display='flex';}
  }else if(h.match(/^doc-/)){
    var f=findDoc(h.replace('doc-',''));
    if(f){title=f.doc.no+' '+f.doc.title;backBtn.style.display='flex';}
  }else if(h==='flows'){title='🔄 业务流程总览';backBtn.style.display='flex';}
  else if(h==='shots'){title='📷 截图清单';backBtn.style.display='flex';}
  else if(h==='about'){title='ℹ️ 关于';backBtn.style.display='flex';}
  else{title='慧镕科技 · 操作手册';backBtn.style.display='none';}

  document.querySelectorAll('.nav-item').forEach(function(a){a.classList.remove('active')});
  var el=document.querySelector('[data-nav="'+h+'"]');
  if(el)el.classList.add('active');
  var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===h){idx=i;break}
  document.getElementById('prevBtn').disabled=idx<=0;
  document.getElementById('nextBtn').disabled=idx>=ALL_NAV.length-1;
}

/* ===== 导航（场景分组 = 一级，单据名 = 二级） ===== */
var ALL_NAV=[];
function buildNav(){
  var role=CURRENT_ROLE,items=[],all=[];
  items.push({t:'首页',ic:'🏠',k:'home',badge:'',grp:false});
  all.push({t:'首页',k:'home'});

    if(sc)addScene(sc,role!=='lead');
  });
  items.push({t:'速查',ic:'',k:'',badge:'',grp:true});
  [{t:'业务流程总览',ic:'🔄',k:'flows',badge:''},{t:'截图清单',ic:'📷',k:'shots',badge:'45处'},{t:'关于',ic:'ℹ️',k:'about',badge:''}].forEach(function(it){items.push({t:it.t,ic:it.ic,k:it.k,badge:it.badge,grp:false});all.push({t:it.t,k:it.k});});
  ALL_NAV=all;
  var h='',inGroup=false;
  items.forEach(function(it){
    if(it.grp){if(inGroup)h+='</div>';h+='<div class="nav-group"><div class="nav-group-title'+(it.clickable?' clickable':'')+'"'+(it.clickable?' onclick="go(\''+esc(it.k)+'\')"':'')+'>'+esc(it.t)+(it.clickable?' <span style="font-size:9px;opacity:.5">→</span>':'')+'</div>';inGroup=true;}
    else{
      h+='<div class="nav-item" data-nav="'+esc(it.k)+'" onclick="go(\''+esc(it.k)+'\')">'
        +(it.ic?'<span class="nav-icon">'+it.ic+'</span>':'')
        +esc(it.t)
        +(it.badge?'<span class="nav-badge'+(it.badge.indexOf('📷')>=0?' b-hot':'')+'">'+esc(it.badge)+'</span>':'')
        +'</div>';
    }
  });
  if(inGroup)h+='</div>';
  document.getElementById('navRoot').innerHTML=h;
}

/* ===== 搜索 ===== */
function hl(t,q){t=esc(t);return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}
function onSearch(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var box=document.getElementById('searchResults');
  if(q.length<1){box.classList.remove('active');return;}
  var matches=[];
  searchScope(CURRENT_ROLE).forEach(function(f){
    var text=(f.title+' '+f.text).toLowerCase();
    if(text.indexOf(q)>=0){
      var full=f.text||'';
      var sIdx=Math.max(0,full.toLowerCase().indexOf(q)-16);
      var snippet=full.substring(sIdx,sIdx+78)+(sIdx+78<full.length?'…':'');
      matches.push({id:f.id,title:f.title,path:f.path,snippet:snippet});
    }
  });
  if(matches.length){
    box.innerHTML=matches.slice(0,10).map(function(m){
      return'<div class="search-result-item" onclick="go(\''+esc(m.id)+'\');document.getElementById(\'searchResults\').classList.remove(\'active\');document.getElementById(\'q\').value=\'\'">'
        +'<div class="sr-title">'+hl(m.title,q)+'</div>'
        +'<div class="sr-path">'+esc(m.path)+'</div>'
        +'<div class="sr-snippet">'+hl(m.snippet,q)+'</div></div>';
    }).join('');
  }else{
    box.innerHTML='<div class="search-result-item"><div class="sr-title" style="color:var(--m-text-light)">没找到相关的，换个关键词试试？</div></div>';
  }
  box.classList.add('active');
}

/* ===== 截图上传 ===== */
var _shotPending=null;
function uploadShot(no){_shotPending=no;document.getElementById('shotFileInput').click()}
function replaceShot(no){_shotPending=no;document.getElementById('shotFileInput').click()}
function removeShot(no){try{localStorage.removeItem('glwd_img_'+no)}catch(e){}var h=location.hash.replace('#/','')||'home';renderContent(h)}
function handleShotFile(input){
  var file=input.files[0],no=_shotPending;_shotPending=null;
  if(!file||!no)return;
  if(file.size>20*1024*1024){alert('图片不能超过20MB');input.value='';return}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),maxW=800,maxH=600,w=img.width,h=img.height;
      if(w>maxW){h*=maxW/w;w=maxW}if(h>maxH){w*=maxH/h;h=maxH}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      var data=c.toDataURL('image/jpeg',0.65);
      try{localStorage.setItem('glwd_img_'+no,data)}catch(ex){
        alert('存储空间不足！请先删除部分截图。或命名为 FIG.'+no+'.png 放入 images 文件夹');input.value='';return}
      input.value='';var h=location.hash.replace('#/','')||'home';renderContent(h);
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
/* ===== 涟漪 ===== */
function initRipple(){
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.btn-ripple');if(!btn)return;
    var r=btn.getBoundingClientRect(),s=16;
    var rip=document.createElement('span');rip.className='ripple';
    rip.style.left=(e.clientX-r.left-s/2)+'px';rip.style.top=(e.clientY-r.top-s/2)+'px';
    rip.style.width=rip.style.height=s+'px';btn.appendChild(rip);
    setTimeout(function(){rip.remove()},550);
  });
}
