<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧镕科技 · 金蝶云星空ERP · 员工操作手册</title>
<style>
:root{
  --bg:#F4F7FA;--card:#fff;--primary:#4A7DA8;--primary-dark:#3A6590;--accent:#7BA7C7;
  --text:#2F3B47;--text2:#5E6B78;--text-light:#93A0AC;--border:#DEE6EE;--hi:#F0F5FA;
  --tag:#E9F0F6;--green:#6FA287;--green-bg:#EDF5F0;--rose:#C08080;--rose-bg:#F9EFEF;
  --warn:#B8863B;--warn-bg:#FBF4E8;--r:6px;--shadow:0 1px 2px rgba(47,59,71,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:13.5px}

/* ═══ Header ═══ */
.header{background:linear-gradient(135deg,#3A6590,#4A7DA8,#6FA287);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:600;letter-spacing:1.5px;white-space:nowrap}
.header .meta{font-size:11px;opacity:.7;white-space:nowrap}

/* ═══ Layout ═══ */
.layout{display:flex;min-height:calc(100vh - 46px)}

/* ═══ Sidebar ═══ */
.sidebar{width:240px;min-width:240px;background:var(--card);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:100}
.sidebar-search{position:relative;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-search input{width:100%;padding:6px 10px 6px 26px;border:1px solid var(--border);border-radius:14px;font-size:12px;background:var(--bg);outline:none;transition:border-color .3s}
.sidebar-search input:focus{border-color:var(--accent)}
.search-results{position:absolute;top:100%;left:8px;right:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(47,59,71,.14);max-height:340px;overflow-y:auto;margin-top:4px;display:none;z-index:300}
.search-results.active{display:block}
.search-result-item{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--hi)}
.search-result-item .sr-title{font-weight:600;font-size:12.5px}
.search-result-item .sr-path{font-size:10.5px;color:var(--text-light);margin-top:1px}
.search-result-item .sr-snippet{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.5}
.search-result-item mark{background:#F6E7B8;border-radius:2px;padding:0 2px}
.role-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.role-tab{flex:1;padding:7px 2px;text-align:center;font-size:10.5px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.role-tab:hover{color:var(--primary);background:var(--hi)}
.role-tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.role-tab .ti{display:block;font-size:14px;margin-bottom:1px}
.sidebar-tree{flex:1;overflow-y:auto;padding:4px 0}
.tree-group{margin-bottom:1px}
.tree-h{display:flex;align-items:center;gap:5px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s;position:relative}
.tree-h:hover{background:var(--hi)}
.tree-h .arrow{font-size:8px;color:var(--text-light);transition:transform .2s;width:10px;flex-shrink:0}
.tree-h.open .arrow{transform:rotate(90deg)}
.tree-h.active{background:var(--hi);color:var(--primary)}
.tree-h.active::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:0 2px 2px 0;background:var(--primary)}
.tree-subs{overflow:hidden;max-height:0;transition:max-height .3s ease}
.tree-h.open+.tree-subs{max-height:2000px}
.tree-sub{display:block;padding:3.5px 12px 3.5px 28px;font-size:11.5px;color:var(--text2);cursor:pointer;transition:all .15s;position:relative}
.tree-sub:hover{color:var(--primary);background:var(--hi)}
.tree-sub.active{color:var(--primary);font-weight:600}
.tree-sub.active::before{content:'';position:absolute;left:20px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--primary);transform:translateY(-50%)}

/* ═══ Content ═══ */
.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.breadcrumb{padding:6px 22px;font-size:11.5px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50}
.content{flex:1;padding:14px 22px 40px;max-width:860px}
.c-section{margin-bottom:22px;scroll-margin-top:46px}
.c-section h2{font-size:17px;font-weight:700;padding-bottom:5px;border-bottom:2px solid var(--primary);margin-bottom:10px}
.c-section h3{font-size:13.5px;font-weight:600;color:var(--primary-dark);margin:12px 0 5px}
.path{display:inline-flex;align-items:center;gap:4px;background:var(--tag);padding:2px 8px;border-radius:4px;font-size:11px;color:var(--primary-dark);margin:2px 0 6px}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:6px 8px;background:var(--hi);border:1px solid var(--border);border-radius:var(--r);margin:6px 0;font-size:11.5px}
.flow .fl{color:var(--primary-dark);font-weight:600;background:#fff;border:1px solid var(--accent);border-radius:4px;padding:2px 8px}
.flow .fa{color:var(--text-light)}
.step{position:relative;padding:7px 10px 7px 34px;margin:4px 0;background:var(--hi);border-radius:var(--r);border-left:3px solid var(--accent)}
.step::before{content:attr(data-n);position:absolute;left:6px;top:7px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .st{font-weight:600;font-size:12.5px;margin-bottom:1px}
.step .sd{font-size:12px;color:var(--text2);line-height:1.6}
.tip{padding:6px 10px;border-radius:var(--r);margin:5px 0;font-size:12px;line-height:1.6}
.tip-w{background:var(--warn-bg);border-left:3px solid var(--warn);color:#7A5A1E}.tip-w::before{content:"⚠ "}
.tip-i{background:var(--tag);border-left:3px solid var(--accent);color:#3F5A70}.tip-i::before{content:"💡 "}
.tip-k{background:var(--green-bg);border-left:3px solid var(--green);color:#3D5C48}.tip-k::before{content:"🔑 "}
.tip-r{background:var(--rose-bg);border-left:3px solid var(--rose);color:#7A3F3F}.tip-r::before{content:"✘ "}
table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0;border-radius:var(--r);overflow:hidden}
thead th{padding:5px 8px;text-align:left;font-weight:600;font-size:11px;background:var(--primary);color:#fff}
tbody td{padding:4.5px 8px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:var(--hi)}
/* 截图上传 */
.shot{margin:5px 0;border-radius:var(--r);overflow:hidden}
.shot-placeholder{background:var(--hi);border:2px dashed var(--border);border-radius:var(--r);padding:7px 10px;font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:flex-start}
.shot-placeholder b{color:var(--primary-dark)}
.shot-placeholder .snote{color:var(--rose)}
.shot-hint{font-size:10.5px;color:var(--text-light);margin-top:2px}
.shot.has-img{padding:3px;background:var(--hi);border:1.5px solid #C3D4E2}
.shot-img img{width:100%;border-radius:4px;cursor:zoom-in;display:block}
.shot-img img.full{position:fixed;inset:0;z-index:300;width:100vw;height:100vh;object-fit:contain;background:rgba(0,0,0,.85);border-radius:0;cursor:zoom-out}
.shot-info{padding:3px 7px;font-size:11px;color:var(--text2)}
.shot-actions{display:flex;gap:4px;padding:0 7px 4px}
.shot-btn{font-size:10.5px;padding:2px 9px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;color:var(--primary-dark)}
.shot-btn:hover{background:var(--tag)}
/* 速查 */
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.qrow select,.qrow input{padding:5px 8px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;outline:none;background:#fff}
.qrow select:focus,.qrow input:focus{border-color:var(--accent)}
.qbtn{padding:5px 14px;border:none;border-radius:var(--r);background:var(--primary);color:#fff;font-size:12px;cursor:pointer}
.qbtn:hover{background:var(--primary-dark)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:8px 0}
.chain .node{background:var(--tag);border:1.5px solid var(--primary);color:var(--primary-dark);border-radius:5px;padding:4px 9px;font-size:12px;font-weight:600}
.chain .node.final{background:var(--primary);color:#fff}
.chain .arr{color:var(--text-light);font-size:13px}
.ccline{margin-top:4px;font-size:11px;color:var(--text2)}
.ccline b{color:var(--primary-dark)}
@keyframes scaleIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.chain .node.scale-in{opacity:0;transform:scale(.3)}
.chain .node.scale-in.done{animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1) both}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:8px 0}
.lead-card{background:var(--hi);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.lead-card h4{font-size:13px;color:var(--primary-dark);margin-bottom:6px}
/* 分页器 */
.pager{display:flex;justify-content:space-between;padding:10px 0;margin-top:14px;border-top:1px solid var(--border)}
.pager button{padding:5px 14px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);font-size:11px;cursor:pointer}
.pager button:hover:not(:disabled){background:var(--tag)}
.pager button:disabled{opacity:.3;cursor:default}
.btt{position:fixed;bottom:16px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:14px;cursor:pointer;opacity:0;transition:opacity .3s;z-index:200;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btt.show{opacity:1}
.btn-ripple{position:relative;overflow:hidden}
.btn-ripple .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);animation:rippleAnim .55s}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
.sidebar-toggle{display:none;position:fixed;bottom:16px;left:14px;z-index:300;width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media(max-width:800px){
  .sidebar{position:fixed;left:-240px;transition:left .3s;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  .sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .content{padding:12px 12px 50px}
  .breadcrumb{padding:6px 12px}
}
</style>
</head>

<script>/* ===== 数据引擎 ===== */
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var META = DATA.meta;
var CHAPTERS = DATA.chapters;
CHAPTERS.sort(function(a,b){return a.no-b.no});
var FLAT=[];
CHAPTERS.forEach(function(ch){
  var parts=['第'+ch.no+'章 '+ch.title, ch.flow, ch.scope||'', (ch.rules||[]).join(' '), (ch.prep||[]).join(' '), (ch.audit||[]).join(' '), (ch.risks||[]).join(' ')];
  (ch.steps||[]).forEach(function(st,i){parts.push(st.title+' '+(st.desc||''));});
  FLAT.push({id:'ch'+ch.no, ch:ch.no, sec:ch.no, title:'第'+ch.no+'章 '+ch.title, path:'第'+ch.no+'章 '+ch.title, text:parts.join(' ')});
});

/* ===== 工具 ===== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderTable(tbl){if(!tbl||!tbl.length)return'';var h='<table><thead><tr>'+tbl[0].map(function(c){return'<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';
  for(var i=1;i<tbl.length;i++)h+='<tr>'+tbl[i].map(function(c){return'<td>'+esc(c)+'</td>'}).join('')+'</tr>';return h+'</tbody></table>';}
function bullets(arr){if(!arr||!arr.length)return'';return'<ul style="margin:4px 0 6px 18px;font-size:12.5px">'+arr.map(function(b){return'<li>'+esc(b)+'</li>'}).join('')+'</ul>';}
function renderFlow(steps){if(!steps||!steps.length)return'';return'<div class="flow">'+steps.map(function(s,i){return'<span class="fl">'+esc(s)+'</span>'+(i<steps.length-1?'<span class="fa">→</span>':'')}).join('')+'</div>';}

/* ===== 截图上传（保留） ===== */
function renderShot(shot){
  if(!shot||!shot.no)return'';
  var key='glwd_img_'+shot.no,saved=null;
  try{saved=localStorage.getItem(key)}catch(e){}
  if(saved)return'<div class="shot has-img" data-shot="'+esc(shot.no)+'">'
    +'<div class="shot-img"><img src="'+esc(saved)+'" alt="'+esc(shot.title)+'" onclick="this.classList.toggle(\'full\')"></div>'
    +'<div class="shot-info">📷 FIG.'+esc(shot.no)+' '+esc(shot.title)+'</div>'
    +'<div class="shot-actions"><button class="shot-btn" onclick="replaceShot(\''+esc(shot.no)+'\')">🔄 替换</button><button class="shot-btn" onclick="removeShot(\''+esc(shot.no)+'\')">🗑 删除</button></div></div>';
  return'<div class="shot" data-shot="'+esc(shot.no)+'">'
    +'<div class="shot-placeholder"><span>📷</span><div><b>FIG.'+esc(shot.no)+' '+esc(shot.title)+'</b>'
    +(shot.ui?'<br>界面：'+esc(shot.ui):'')
    +(shot.fields?'<br>字段：'+esc(shot.fields):'')
    +(shot.note?'<br><span class="snote">说明：'+esc(shot.note)+'</span>':'')
    +'</div></div>'
    +'<div style="padding:0 10px 6px"><button class="shot-btn" onclick="uploadShot(\''+esc(shot.no)+'\')">📁 上传截图</button>'
    +'<span class="shot-hint"> 或命名为 <code>FIG.'+esc(shot.no)+'.png</code> 放入 images 文件夹</span></div></div>';
}

/* ===== 章节渲染 ===== */
function renderChapter(ch){
  var h='<div class="c-section" id="sec-'+ch.no+'"><h2>第'+ch.no+'章 '+esc(ch.title)+'</h2>';
  if(ch.flow)h+='<h3>📄 单据链路</h3>'+renderFlow(ch.flow.split('→'));
  if(ch.scope)h+='<h3>🎯 业务适用范围</h3><p style="font-size:12.5px">'+esc(ch.scope)+'</p>';
  if(ch.rules&&ch.rules.length)h+='<h3>📏 业务规则判断</h3>'+bullets(ch.rules);
  if(ch.prep&&ch.prep.length)h+='<h3>📋 前置准备</h3>'+bullets(ch.prep);
  if(ch.audience&&ch.audience.length)h+='<h3>👥 适用对象</h3>'+bullets(ch.audience);
  if(ch.steps&&ch.steps.length){
    h+='<h3>👣 详细操作步骤</h3>';
    ch.steps.forEach(function(st,i){
      h+='<div class="step" data-n="'+(i+1)+'"><div class="st">'+esc(st.title)+'</div>'+(st.desc?'<div class="sd">'+esc(st.desc)+'</div>':'')+'</div>';
    });
  }
  if(ch.audit&&ch.audit.length)h+='<h3>🔍 审核关注点</h3>'+bullets(ch.audit);
  if(ch.shots&&ch.shots.length){
    h+='<h3>📷 截图占位与字段要求</h3>';
    ch.shots.forEach(function(s){h+=renderShot(s);});
  }
  if(ch.risks&&ch.risks.length)h+='<h3>⚠️ 常见风险</h3>'+ch.risks.map(function(r){return'<div class="tip tip-r">'+esc(r)+'</div>'}).join('');
  return h+'</div>';
}
function renderChapterById(id){
  var no=parseInt(String(id).replace('ch',''));
  var ch=CHAPTERS.filter(function(c){return c.no===no})[0];if(!ch)return'';
  return renderChapter(ch);
}

/* ===== 角色 ===== */
var CURRENT_ROLE='all';
var ROLE_DEF={all:{name:'全部',icon:'📋'},ops:{name:'操作人员',icon:'👤'},fin:{name:'财务人员',icon:'💰'},lead:{name:'领导层',icon:'📊'}};

/* ===== 首页 ===== */
function renderHome(){
  var h='<div class="c-section"><h2>📋 慧镕科技 · 金蝶云星空ERP 操作手册</h2>';
  h+='<p style="font-size:12.5px;color:var(--text2)">'+esc(META.notice)+'</p>';
  h+='<h3>🏭 业务模块总览（'+CHAPTERS.filter(function(c){return c.no>2}).length+'个业务模块）</h3>';
  h+='<table><thead><tr><th style="width:26%">业务域</th><th>核心单据链</th></tr></thead><tbody>';
  CHAPTERS.filter(function(c){return c.no>2}).forEach(function(ch){
    h+='<tr><td><b>'+esc(ch.title)+'</b> <a href="#/ch'+ch.no+'" style="font-size:11px;color:var(--primary)">[进入]</a></td><td style="font-size:11.5px;color:var(--text2)">'+esc(ch.flow||'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="c-section"><h2>📚 章节目录</h2>';
  h+='<table><thead><tr><th>章</th><th>章节</th><th>要点</th></tr></thead><tbody>';
  CHAPTERS.forEach(function(ch){
    var pts=[];
    if(ch.flow)pts.push(ch.flow.split('→').length+'步单据链');
    if(ch.steps&&ch.steps.length)pts.push(ch.steps.length+'个步骤');
    if(ch.risks&&ch.risks.length)pts.push(ch.risks.length+'个风险点');
    h+='<tr><td><b>'+ch.no+'</b></td><td><b>'+esc(ch.title)+'</b> <a href="#/ch'+ch.no+'" style="font-size:11px;color:var(--primary)">[进入]</a></td><td style="font-size:11px;color:var(--text2)">'+esc(pts.join(' · '))+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* ===== 渲染入口 ===== */
function renderContent(pageId){
  var main=document.getElementById('mainContent');
  if(!main)return;
  if(pageId==='home')main.innerHTML=renderHome();
  else if(pageId==='flows'){
    var h='<div class="c-section"><h2>🔄 单据链路总览</h2>';
    CHAPTERS.filter(function(c){return c.flow}).forEach(function(ch){h+='<h3>'+esc(ch.title)+'</h3>'+renderFlow(ch.flow.split('→'));});
    main.innerHTML=h+'</div>';
  }else if(pageId==='shots'){
    var items=[];
    CHAPTERS.forEach(function(ch){(ch.shots||[]).forEach(function(s){items.push({no:s.no,ch:ch.no,title:s.title,ui:s.ui||''});});});
    var h='<div class="c-section"><h2>📷 待补截图清单</h2><p style="font-size:12px;color:var(--text2)">共 '+items.length+' 处。已上传的显示 📷 已上传。</p>';
    h+='<table><thead><tr><th>编号</th><th>界面</th><th>所属</th><th>状态</th></tr></thead><tbody>';
    items.forEach(function(it){
      var imgSaved=null;try{imgSaved=localStorage.getItem('glwd_img_'+it.no)}catch(e){}
      h+='<tr><td><b>FIG.'+esc(it.no)+'</b></td><td>'+esc(it.title)+' '+(it.ui?'<span style="color:var(--text-light);font-size:11px">'+esc(it.ui)+'</span>':'')+'</td><td>第'+it.ch+'章</td><td>'
        +(imgSaved?'<span style="color:var(--green);font-weight:600">📷 已上传</span> <a href="javascript:removeShot(\''+esc(it.no)+'\')" style="color:var(--rose);font-size:11px">[删]</a>':'<span style="color:var(--text-light)">待补</span>')
        +' <a href="#/ch'+it.ch+'" style="font-size:11px">[查看]</a></td></tr>';
    });
    main.innerHTML=h+'</tbody></table></div>';
  }else if(pageId==='about')main.innerHTML='<div class="c-section"><h2>关于本手册</h2><table><tbody><tr><th style="width:120px">项目</th><td>'+esc(META.project)+'</td></tr><tr><th>适用系统</th><td>'+esc(META.product)+'</td></tr><tr><th>编制单位</th><td>'+esc(META.author)+'</td></tr><tr><th>版本</th><td>'+esc(META.version)+' · '+esc(META.date)+'</td></tr><tr><th>待补截图</th><td>共46处，见截图清单</td></tr></tbody></table></div>';
  else{
    var id=pageId;
    if(id.indexOf('/')>0)id=id.split('/')[0];
    var no=parseInt(String(id).replace('ch',''));
    var ch=CHAPTERS.filter(function(c){return c.no===no})[0];
    if(ch)main.innerHTML=renderChapter(ch);
    else main.innerHTML='<div class="c-section"><h2>未找到内容</h2></div>';
  }
  window.scrollTo(0,0);
}
/* 搜索索引 */
function searchScope(role){
  if(role==='ops')return FLAT.filter(function(f){return f.ch>=3&&f.ch<=19;});
  if(role==='fin')return FLAT.filter(function(f){return f.ch>=9&&f.ch<=19;});
  if(role==='lead')return FLAT.filter(function(f){return f.ch<=2||f.ch===18||f.ch===19;});
  return FLAT;
}
</script>
<script>/* ===== 交互层 ===== */
function boot(){
  var saved=null;try{saved=localStorage.getItem('glwd_role')}catch(e){}
  if(saved==='all'||saved==='ops'||saved==='fin'||saved==='lead')CURRENT_ROLE=saved;
  else CURRENT_ROLE='all';
  document.querySelectorAll('#roleTabs .role-tab').forEach(function(t){t.classList.toggle('active',t.dataset.role===CURRENT_ROLE)});
  buildNav();renderContent('home');route();
  window.addEventListener('hashchange',route);
  document.getElementById('q').addEventListener('input',onSearch);
  document.addEventListener('click',function(e){if(!e.target.closest('.sidebar-search'))document.getElementById('searchResults').classList.remove('active')});
  window.addEventListener('scroll',function(){document.getElementById('btt').classList.toggle('show',window.scrollY>300)});
  initRipple();
}
window.addEventListener('DOMContentLoaded',boot);

/* ===== 角色切换 ===== */
function pickRole(r){
  CURRENT_ROLE=r;try{localStorage.setItem('glwd_role',r)}catch(e){}
  document.querySelectorAll('#roleTabs .role-tab').forEach(function(t){t.classList.toggle('active',t.dataset.role===r)});
  buildNav();renderContent('home');go('home');
}
function go(h){location.hash='#/'+h.replace(/^\//,'');}
function goPrev(){var cur=location.hash.replace('#/','')||'home';var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===cur){idx=i;break}if(idx>0)go(ALL_NAV[idx-1].k);}
function goNext(){var cur=location.hash.replace('#/','')||'home';var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===cur){idx=i;break}if(idx>=0&&idx<ALL_NAV.length-1)go(ALL_NAV[idx+1].k);}

/* ===== 路由 ===== */
function route(){
  var h=location.hash.replace('#/','')||'home';
  renderContent(h);
  var bc='📖 <b>慧镕科技 · 操作手册</b>';
  if(h!=='home'&&h.match(/^ch\d/)){
    var ch=CHAPTERS.filter(function(c){return c.id===h.split('/')[0]})[0];
    if(ch)bc+=' › 第'+ch.no+'章 '+ch.title;
  }else if(h==='flows')bc+=' › 单据链路总览';
  else if(h==='shots')bc+=' › 截图清单';
  else if(h==='about')bc+=' › 关于';
  document.getElementById('bcText').innerHTML=bc;
  document.querySelectorAll('.tree-h, .tree-sub').forEach(function(a){a.classList.remove('active')});
  var el=document.querySelector('[data-nav="'+h+'"]');
  if(el)el.classList.add('active');
  var idx=-1;for(var i=0;i<ALL_NAV.length;i++)if(ALL_NAV[i].k===h){idx=i;break}
  document.getElementById('prevBtn').disabled=idx<=0;
  document.getElementById('nextBtn').disabled=idx>=ALL_NAV.length-1;
}

/* ===== 树导航 ===== */
var ALL_NAV=[];
var GROUP_DEF=[
  {title:'生产制造',from:3,to:8},
  {title:'采购仓储',from:9,to:14},
  {title:'销售关务',from:15,to:17},
  {title:'财务成本',from:18,to:19}
];
function buildNav(){
  var role=CURRENT_ROLE,items=[],all=[];
  items.push({t:'首页',k:'home',type:'h'});
  all.push({t:'首页',k:'home'});
  function pushCh(ch){items.push({t:'第'+ch.no+'章 '+ch.title,k:'ch'+ch.no,type:'sub'});all.push({t:ch.title,k:'ch'+ch.no});}
  if(role==='all'){
    items.push({t:'文档与规则',k:'',type:'group'});
    pushCh(CHAPTERS[0]);pushCh(CHAPTERS[1]);
    GROUP_DEF.forEach(function(g){
      items.push({t:g.title,k:'',type:'group'});
      CHAPTERS.forEach(function(ch){if(ch.no>=g.from&&ch.no<=g.to)pushCh(ch);});
    });
    items.push({t:'速查',k:'',type:'group'});
    [{t:'单据链路总览',k:'flows'},{t:'截图清单',k:'shots'},{t:'关于',k:'about'}].forEach(function(it){items.push({t:it.t,k:it.k,type:'sub'});all.push({t:it.t,k:it.k});});
  }else if(role==='ops'){
    items.push({t:'生产制造',k:'',type:'group'});
    CHAPTERS.forEach(function(ch){if(ch.no>=3&&ch.no<=8)pushCh(ch);});
    items.push({t:'采购仓储',k:'',type:'group'});
    CHAPTERS.forEach(function(ch){if(ch.no>=9&&ch.no<=14)pushCh(ch);});
    items.push({t:'销售关务',k:'',type:'group'});
    CHAPTERS.forEach(function(ch){if(ch.no>=15&&ch.no<=17)pushCh(ch);});
    items.push({t:'速查',k:'',type:'group'});
    [{t:'单据链路总览',k:'flows'},{t:'截图清单',k:'shots'}].forEach(function(it){items.push({t:it.t,k:it.k,type:'sub'});all.push({t:it.t,k:it.k});});
  }else if(role==='fin'){
    items.push({t:'财务成本',k:'',type:'group'});
    CHAPTERS.forEach(function(ch){if(ch.no>=9&&ch.no<=19)pushCh(ch);});
    items.push({t:'速查',k:'',type:'group'});
    [{t:'单据链路总览',k:'flows'},{t:'截图清单',k:'shots'}].forEach(function(it){items.push({t:it.t,k:it.k,type:'sub'});all.push({t:it.t,k:it.k});});
  }else{
    items.push({t:'总览',k:'',type:'group'});
    pushCh(CHAPTERS[0]);pushCh(CHAPTERS[1]);
    items.push({t:'业务域',k:'',type:'group'});
    GROUP_DEF.forEach(function(g){
      CHAPTERS.forEach(function(ch){if(ch.no>=g.from&&ch.no<=g.to)pushCh(ch);});
    });
    items.push({t:'速查',k:'',type:'group'});
    [{t:'单据链路总览',k:'flows'},{t:'截图清单',k:'shots'}].forEach(function(it){items.push({t:it.t,k:it.k,type:'sub'});all.push({t:it.t,k:it.k});});
  }
  ALL_NAV=all;
  var h='',inGroup=false;
  items.forEach(function(it){
    if(it.type==='group'){if(inGroup)h+='</div>';h+='<div class="tree-group"><div class="tree-h open" onclick="this.classList.toggle(\'open\')"><span class="arrow">▶</span>'+esc(it.t)+'</div><div class="tree-subs">';inGroup=true;}
    else if(it.type==='sub')h+='<div class="tree-sub" data-nav="'+esc(it.k)+'" onclick="go(\''+esc(it.k)+'\')">'+esc(it.t)+'</div>';
    else h+='<div class="tree-h" data-nav="'+esc(it.k)+'" onclick="go(\''+esc(it.k)+'\')">'+esc(it.t)+'</div>';
  });
  if(inGroup)h+='</div></div>';
  document.getElementById('navRoot').innerHTML=h;
}

/* ===== 搜索（下拉面板） ===== */
function hl(t,q){t=esc(t);return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}
function onSearch(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var box=document.getElementById('searchResults');
  if(q.length<1){box.classList.remove('active');return;}
  var matches=[];
  searchScope(CURRENT_ROLE).forEach(function(f){
    var text=(f.title+' '+f.text).toLowerCase();
    if(text.indexOf(q)>=0){
      var full=f.text||'';
      var sIdx=Math.max(0,full.toLowerCase().indexOf(q)-16);
      var snippet=full.substring(sIdx,sIdx+78)+(sIdx+78<full.length?'…':'');
      matches.push({id:f.id,title:f.title,path:'第'+f.ch+'章',snippet:snippet});
    }
  });
  if(matches.length){
    box.innerHTML=matches.slice(0,10).map(function(m){
      return'<div class="search-result-item" onclick="go(\''+esc(m.id)+'\');document.getElementById(\'searchResults\').classList.remove(\'active\');document.getElementById(\'q\').value=\'\'">'
        +'<div class="sr-title">'+hl(m.title,q)+'</div>'
        +'<div class="sr-path">'+esc(m.path)+'</div>'
        +'<div class="sr-snippet">'+hl(m.snippet,q)+'</div></div>';
    }).join('');
  }else{
    box.innerHTML='<div class="search-result-item"><div class="sr-title" style="color:var(--text2)">没找到相关的，换个关键词试试？</div></div>';
  }
  box.classList.add('active');
}

/* ===== 截图上传（保留） ===== */
var _shotPending=null;
function uploadShot(no){_shotPending=no;document.getElementById('shotFileInput').click()}
function replaceShot(no){_shotPending=no;document.getElementById('shotFileInput').click()}
function removeShot(no){try{localStorage.removeItem('glwd_img_'+no)}catch(e){}var h=location.hash.replace('#/','')||'home';renderContent(h)}
function handleShotFile(input){
  var file=input.files[0],no=_shotPending;_shotPending=null;
  if(!file||!no)return;
  if(file.size>20*1024*1024){alert('图片不能超过20MB');input.value='';return}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),maxW=800,maxH=600,w=img.width,h=img.height;
      if(w>maxW){h*=maxW/w;w=maxW}if(h>maxH){w*=maxH/h;h=maxH}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      var data=c.toDataURL('image/jpeg',0.65);
      try{localStorage.setItem('glwd_img_'+no,data)}catch(ex){
        alert('存储空间不足！请先删除部分截图。或命名为 FIG.'+no+'.png 放入 images 文件夹');input.value='';return}
      input.value='';var h=location.hash.replace('#/','')||'home';renderContent(h);
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
/* ===== 涟漪 ===== */
function initRipple(){
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.btn-ripple');if(!btn)return;
    var r=btn.getBoundingClientRect(),s=16;
    var rip=document.createElement('span');rip.className='ripple';
    rip.style.left=(e.clientX-r.left-s/2)+'px';rip.style.top=(e.clientY-r.top-s/2)+'px';
    rip.style.width=rip.style.height=s+'px';btn.appendChild(rip);
    setTimeout(function(){rip.remove()},550);
  });
}
</script>
