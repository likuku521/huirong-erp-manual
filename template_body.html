<body>

<!-- ═══ LANDING 入口选择 ═══ -->
<div id="landing">
  <div class="landing-header">
    <div class="company">HUI RONG TECH</div>
    <h1>慧镕科技 · 金蝶云星空ERP</h1>
    <div class="subtitle">最终用户操作手册 · 亮色紧凑版</div>
    <div class="divider"></div>
  </div>
  <div class="role-cards" id="landingCards"></div>
</div>

<!-- ═══ 岗位选择层（操作人员细分） ═══ -->
<div id="postGate" style="display:none">
  <div class="post-box">
    <h2>👤 请选择你的岗位</h2>
    <p>操作人员按岗位细分，系统将展示与你岗位相关的单据与操作</p>
    <div class="post-grid" id="postGrid"></div>
    <div style="font-size:12px;color:var(--m-text-light);margin-top:14px">顶栏角色徽标可随时切换身份</div>
  </div>
</div>

<!-- ═══ 主应用 ═══ -->
<div id="app">

  <!-- 顶栏 -->
  <div class="top-bar">
    <button class="back-btn" id="backBtn" title="返回上一级">←</button>
    <span class="title" id="topTitle">慧镕科技 · 操作手册</span>
    <span class="home-link" onclick="goHome()">🏠 首页</span>
    <button class="entry-link" onclick="backToLanding()">↩ 返回入口</button>
    <div class="role-switch">
      <span class="role-badge" id="roleBadge" onclick="toggleRoleMenu()">📋 全部 ▾</span>
      <div class="role-menu" id="roleMenu">
        <div class="role-menu-title">切换身份视角</div>
        <div class="role-menu-item" data-role="all" onclick="switchRole('all')">📋 全部内容</div>
        <div class="role-menu-item" data-role="ops" onclick="switchRole('ops')">👤 操作人员</div>
        <div class="role-menu-item" data-role="fin" onclick="switchRole('fin')">💰 财务人员</div>
        <div class="role-menu-item" data-role="lead" onclick="switchRole('lead')">📊 领导层</div>
        <div class="role-menu-item sep" id="roleMenuPost" onclick="switchPostFromApp()" style="display:none">🎯 切换岗位（当前：<span id="roleMenuPostName"></span>）</div>
        <div class="role-menu-item sep" onclick="enterApp(CURRENT_ROLE)">🏠 返回入口页</div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="q" placeholder="搜索单据、操作、流程…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="content-wrapper">
    <!-- 侧边导航 -->
    <nav class="sidebar" id="sidebar">
      <div id="navRoot"></div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <div class="pager" id="pager">
    <button id="prevBtn" disabled onclick="goPrev()">← 上一节</button>
    <button id="nextBtn" onclick="goNext()">下一节 →</button>
  </div>
</div>

<button class="sidebar-toggle" id="sidebarToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<button class="btt" id="btt" onclick="window.scrollTo(0,0)">↑</button>

<input type="file" id="shotFileInput" accept="image/*" style="display:none" onchange="handleShotFile(this)">

<script id="app-data" type="application/json">__DATA_JSON__</script>
<script>__RENDER_JS__</script>
<script>__APP_JS__</script>
</body>
</html>
